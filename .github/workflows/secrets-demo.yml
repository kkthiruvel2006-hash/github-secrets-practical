
name: GitHub Secrets Practical

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: practical_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Connect to MySQL using GitHub Secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD secret is missing"
            exit 1
          fi

          export MYSQL_PWD="$DB_PASSWORD"

          mysql --protocol=TCP \
            -h 127.0.0.1 \
            -P 3306 \
            -u root \
            practical_db \
            -e "SELECT 'MySQL connected successfully' AS result;"

          echo "MySQL connection and query successful"
