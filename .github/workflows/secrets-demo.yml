
name: GitHub Secrets Practical

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-demo:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: practical_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
  
     
      - name: Authenticate with ReqRes API
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error \
            "https://reqres.in/api/collections/products/records?project_id=54854" \
            -H "x-api-key: $API_KEY" \
            -H "X-Reqres-Env: prod" \
            -o response.json

          echo "ReqRes authentication successful"
          cat response.json

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Test MySQL connection using secret
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          export MYSQL_PWD="$DB_PASSWORD"
          mysql --protocol=TCP \
            -h 127.0.0.1 -P 3306 \
            -u root practical_db \
            -e "SELECT 'MySQL connected successfully' AS result;"
